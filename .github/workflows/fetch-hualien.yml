name: 整理花蓮決標資料

on:
  workflow_dispatch:
    inputs:
      year:
        description: 要整理的年度
        required: true
        default: "2011"
        type: choice
        options:
          - "2010"
          - "2011"
          - "2012"
          - "2013"
          - "2014"
          - "2015"
          - "2016"
          - "2017"
          - "2018"
          - "2019"
          - "2020"
          - "2021"
          - "2022"
          - "2023"
          - "2024"
          - "2025"
          - "2026"
      run_mode:
        description: 先測試一週，確認後才執行整年
        required: true
        default: "one_week_test"
        type: choice
        options:
          - "one_week_test"
          - "full_year"
      test_start_date:
        description: 一週測試開始日期（YYYY-MM-DD）
        required: true
        default: "2011-01-01"
        type: string
      test_end_date:
        description: 一週測試結束日期（YYYY-MM-DD）
        required: true
        default: "2011-01-07"
        type: string

permissions:
  contents: write

concurrency:
  group: hualien-procurement-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 選擇年度
        id: years
        shell: bash
        run: |
          echo "list=${{ inputs.year }}" >> "$GITHUB_OUTPUT"
      - name: 低頻率下載並快取
        shell: bash
        run: |
          for year in ${{ steps.years.outputs.list }}; do
            if [ "${{ inputs.run_mode }}" = "one_week_test" ]; then
              python scripts/fetch_procurement.py --region hualien --year "$year" \
                --data-root test-output \
                --start-date "${{ inputs.test_start_date }}" \
                --end-date "${{ inputs.test_end_date }}"
            else
              today="$(date -u +%F)"
              current_year="${today%%-*}"

              if [ "$year" -gt "$current_year" ]; then
                echo "::error::不能整理未來年度：$year（目前為 $current_year）"
                exit 1
              elif [ "$year" -eq "$current_year" ]; then
                echo "當年度 $year：只下載至 $today"
                python scripts/fetch_procurement.py --region hualien --year "$year" --end-date "$today"
              else
                python scripts/fetch_procurement.py --region hualien --year "$year"
              fi
            fi
          done
      - name: 建立跨年度 CSV
        shell: bash
        run: |
          if [ "${{ inputs.run_mode }}" = "one_week_test" ]; then
            python scripts/build_exports.py --region hualien --data-root test-output --years ${{ steps.years.outputs.list }}
          else
            python scripts/build_exports.py --region hualien --years ${{ steps.years.outputs.list }}
          fi
      - name: 上傳一週測試成果
        if: inputs.run_mode == 'one_week_test'
        uses: actions/upload-artifact@v4
        with:
          name: hualien-procurement-${{ inputs.year }}-${{ inputs.run_mode }}
          path: |
            test-output/raw/hualien/**
            test-output/processed/hualien/*.csv
          retention-days: 30
      - name: 上傳全年成果
        if: inputs.run_mode == 'full_year'
        uses: actions/upload-artifact@v4
        with:
          name: hualien-procurement-${{ inputs.year }}-${{ inputs.run_mode }}
          path: |
            data/raw/hualien/**
            data/processed/hualien/*.csv
          retention-days: 30
      - name: 提交可重現資料成果
        if: inputs.run_mode == 'full_year'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f -- data/raw/hualien/*/manifest.json data/raw/hualien/*/errors.json data/raw/hualien/*/decision_index.json
          git add -- data/processed/hualien/*.csv
          if git diff --cached --quiet; then
            echo "沒有資料異動"
          else
            git commit -m "data: update Hualien procurement ${{ inputs.year }}"
            git push
          fi
