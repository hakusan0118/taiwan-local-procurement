name: 整理花蓮決標資料

on:
  workflow_dispatch:
    inputs:
      year:
        description: 要整理的年度
        required: true
        default: "2023"
        type: choice
        options:
          - "2010"
          - "2023"
          - "both"
      run_mode:
        description: 先測試一週，確認後才執行整年
        required: true
        default: "one_week_test"
        type: choice
        options:
          - "one_week_test"
          - "full_year"
      test_start_date:
        description: 一週測試開始日期（YYYY-MM-DD）
        required: true
        default: "2023-01-01"
        type: string
      test_end_date:
        description: 一週測試結束日期（YYYY-MM-DD）
        required: true
        default: "2023-01-07"
        type: string

permissions:
  contents: write

concurrency:
  group: hualien-procurement-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安裝 Excel 產生套件
        run: python -m pip install -r requirements-excel.txt
      - name: 選擇年度
        id: years
        shell: bash
        run: |
          if [ "${{ inputs.year }}" = "both" ]; then
            echo "list=2010 2023" >> "$GITHUB_OUTPUT"
          else
            echo "list=${{ inputs.year }}" >> "$GITHUB_OUTPUT"
          fi
      - name: 低頻率下載並快取
        shell: bash
        run: |
          for year in ${{ steps.years.outputs.list }}; do
            if [ "${{ inputs.run_mode }}" = "one_week_test" ]; then
              python scripts/fetch_procurement.py --year "$year" \
                --data-root test-output \
                --start-date "${{ inputs.test_start_date }}" \
                --end-date "${{ inputs.test_end_date }}"
            else
              python scripts/fetch_procurement.py --year "$year"
            fi
          done
      - name: 建立跨年度 CSV
        shell: bash
        run: |
          if [ "${{ inputs.run_mode }}" = "one_week_test" ]; then
            python scripts/build_exports.py --data-root test-output --years ${{ steps.years.outputs.list }}
          else
            python scripts/build_exports.py --years ${{ steps.years.outputs.list }}
          fi
      - name: 建立私人 Excel 分析檔
        if: inputs.run_mode == 'full_year'
        run: python scripts/build_excel.py --years ${{ steps.years.outputs.list }}
      - name: 上傳一週測試成果
        if: inputs.run_mode == 'one_week_test'
        uses: actions/upload-artifact@v4
        with:
          name: hualien-procurement-${{ inputs.year }}-${{ inputs.run_mode }}
          path: |
            test-output/raw/hualien/**
            test-output/processed/hualien/*.csv
          retention-days: 30
      - name: 上傳全年成果
        if: inputs.run_mode == 'full_year'
        uses: actions/upload-artifact@v4
        with:
          name: hualien-procurement-${{ inputs.year }}-${{ inputs.run_mode }}
          path: |
            data/raw/hualien/**
            data/processed/hualien/*.csv
          retention-days: 30
      - name: 檢查私人 repo Token
        if: inputs.run_mode == 'full_year'
        id: analysis-token
        env:
          ANALYSIS_REPO_TOKEN: ${{ secrets.ANALYSIS_REPO_TOKEN }}
        shell: bash
        run: |
          if [ -n "$ANALYSIS_REPO_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::尚未設定 ANALYSIS_REPO_TOKEN，Excel 已建立但不會傳送到私人 repo"
          fi
      - name: 取出私人分析 repo
        if: inputs.run_mode == 'full_year' && steps.analysis-token.outputs.available == 'true'
        uses: actions/checkout@v4
        with:
          repository: hakusan0118/taiwan-local-procurement-analysis
          token: ${{ secrets.ANALYSIS_REPO_TOKEN }}
          path: private-analysis
      - name: 傳送 Excel 到私人 repo
        if: inputs.run_mode == 'full_year' && steps.analysis-token.outputs.available == 'true'
        shell: bash
        run: |
          cp excel-output/*.xlsx private-analysis/
          cd private-analysis
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- *.xlsx
          if git diff --cached --quiet; then
            echo "私人 Excel 沒有異動"
          else
            git commit -m "analysis: update Hualien Excel ${{ inputs.year }}"
            git push
          fi
      - name: 提交可重現資料成果
        if: inputs.run_mode == 'full_year'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f -- data/raw/hualien/*/manifest.json data/raw/hualien/*/errors.json data/raw/hualien/*/decision_index.json
          git add -- data/processed/hualien/*.csv
          if git diff --cached --quiet; then
            echo "沒有資料異動"
          else
            git commit -m "data: update Hualien procurement ${{ inputs.year }}"
            git push
          fi
