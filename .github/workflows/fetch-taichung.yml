name: 整理臺中決標資料

on:
  workflow_dispatch:
    inputs:
      year:
        description: 要整理的年度
        required: true
        default: "2015"
        type: choice
        options:
          - "2015"
          - "2016"
          - "2017"
          - "2018"
          - "2019"
          - "2020"
          - "2021"
          - "2022"
          - "2023"
          - "2024"
          - "2025"
          - "2026"
      run_mode:
        description: 執行模式
        required: true
        default: "one_week_test"
        type: choice
        options:
          - "one_week_test"
          - "full_year"
          - "repair_dates"
      test_start_date:
        description: 一週測試開始日期（YYYY-MM-DD）
        required: true
        default: "2015-01-01"
        type: string
      test_end_date:
        description: 一週測試結束日期（YYYY-MM-DD）
        required: true
        default: "2015-01-07"
        type: string
      repair_dates:
        description: 補抓日期，以空白、逗號或換行分隔（僅 repair_dates 使用）
        required: false
        default: "2024-12-23, 2025-01-15, 2025-01-22, 2025-02-19, 2025-02-20, 2025-02-21, 2025-03-17, 2025-03-18, 2025-03-19, 2025-03-28, 2025-05-27, 2025-09-10"
        type: string

permissions:
  contents: write

concurrency:
  group: taichung-procurement-data
  cancel-in-progress: false

jobs:
  one-week-test:
    if: inputs.run_mode == 'one_week_test'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 低頻率下載一週並快取
        run: |
          python scripts/fetch_procurement.py --region taichung --year "${{ inputs.year }}" \
            --data-root test-output \
            --start-date "${{ inputs.test_start_date }}" \
            --end-date "${{ inputs.test_end_date }}"
      - name: 建立一週測試 CSV
        run: python scripts/build_exports.py --region taichung --data-root test-output --years "${{ inputs.year }}"
      - name: 上傳一週測試成果
        uses: actions/upload-artifact@v4
        with:
          name: taichung-procurement-${{ inputs.year }}-one-week-test
          path: |
            test-output/raw/taichung/**
            test-output/processed/taichung/*.csv
          retention-days: 30

  repair-dates:
    if: inputs.run_mode == 'repair_dates'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 驗證補抓日期
        env:
          REPAIR_DATES: ${{ inputs.repair_dates }}
        run: |
          python - <<'PY'
          import datetime as dt
          import os
          import re
          from pathlib import Path

          raw = os.environ.get("REPAIR_DATES", "").strip()
          values = sorted(set(re.findall(r"\d{4}-\d{2}-\d{2}", raw)))
          if not values:
              raise SystemExit("repair_dates 模式必須填入至少一個日期")
          leftover = re.sub(r"\d{4}-\d{2}-\d{2}|[\s,]+", "", raw)
          if leftover:
              raise SystemExit(f"repair_dates 含有無法辨識的內容：{leftover}")
          today = dt.datetime.now(dt.timezone.utc).date()
          years = set()
          for value in values:
              try:
                  date = dt.date.fromisoformat(value)
              except ValueError as exc:
                  raise SystemExit(f"日期格式錯誤：{value}（必須為 YYYY-MM-DD）") from exc
              if date > today:
                  raise SystemExit(f"不能補抓未來日期：{value}")
              annual = Path(f"data/processed/taichung/procurement_{date.year}.csv")
              if not annual.exists():
                  raise SystemExit(f"尚無 {date.year} 年年度資料，不能使用日期修補：{annual}")
              years.add(str(date.year))
          Path("repair-dates.txt").write_text("\n".join(values) + "\n", encoding="utf-8")
          Path("repair-years.txt").write_text("\n".join(sorted(years)) + "\n", encoding="utf-8")
          print("準備補抓：" + "、".join(values))
          PY
      - name: 逐日低頻率補抓並建立暫存 CSV
        shell: bash
        run: |
          while IFS= read -r repair_date; do
            repair_year="${repair_date:0:4}"
            python scripts/fetch_procurement.py --region taichung --year "$repair_year" \
              --data-root "repair-runs/$repair_date" \
              --start-date "$repair_date" --end-date "$repair_date"
            python scripts/build_exports.py --region taichung \
              --data-root "repair-runs/$repair_date" --years "$repair_year"
          done < repair-dates.txt
      - name: 安全合併回年度資料
        run: |
          python scripts/apply_date_repairs.py --region taichung --data-root data \
            --repair-root repair-runs --dates-file repair-dates.txt
          while IFS= read -r repair_year; do
            python scripts/validate_processed.py --region taichung \
              --year "$repair_year" --unit-prefix 3.87
          done < repair-years.txt
      - name: 上傳補抓成果
        uses: actions/upload-artifact@v4
        with:
          name: taichung-procurement-date-repairs
          path: |
            repair-dates.txt
            repair-runs/**
            data/processed/taichung/*.csv
          retention-days: 30
      - name: 提交補抓成果
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          while IFS= read -r repair_year; do
            git add -f -- "data/raw/taichung/$repair_year/manifest.json" \
              "data/raw/taichung/$repair_year/errors.json" \
              "data/raw/taichung/$repair_year/decision_index.json"
          done < repair-years.txt
          git add -- data/processed/taichung/*.csv
          if git diff --cached --quiet; then
            echo "沒有臺中資料異動"
          else
            git commit -m "data: repair Taichung procurement dates"
            git push
          fi

  prepare-full-year:
    if: inputs.run_mode == 'full_year'
    runs-on: ubuntu-latest
    outputs:
      months: ${{ steps.months.outputs.months }}
    steps:
      - id: months
        name: 決定需要下載的月份
        shell: bash
        run: |
          python - "${{ inputs.year }}" >> "$GITHUB_OUTPUT" <<'PY'
          import datetime as dt
          import json
          import sys

          year = int(sys.argv[1])
          today = dt.datetime.now(dt.timezone.utc).date()
          if year > today.year:
              raise SystemExit(f"不能整理未來年度：{year}")
          final_month = today.month if year == today.year else 12
          print("months=" + json.dumps([f"{month:02d}" for month in range(1, final_month + 1)]))
          PY

  collect-months:
    if: inputs.run_mode == 'full_year'
    needs: prepare-full-year
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        month: ${{ fromJSON(needs.prepare-full-year.outputs.months) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: dates
        name: 計算月份起迄日期
        shell: bash
        run: |
          python - "${{ inputs.year }}" "${{ matrix.month }}" >> "$GITHUB_OUTPUT" <<'PY'
          import calendar
          import datetime as dt
          import sys

          year, month = map(int, sys.argv[1:])
          start = dt.date(year, month, 1)
          end = dt.date(year, month, calendar.monthrange(year, month)[1])
          today = dt.datetime.now(dt.timezone.utc).date()
          if end > today:
              end = today
          print(f"start={start.isoformat()}")
          print(f"end={end.isoformat()}")
          PY
      - name: 低頻率下載本月份
        run: |
          python scripts/fetch_procurement.py --region taichung --year "${{ inputs.year }}" \
            --data-root monthly-output \
            --start-date "${{ steps.dates.outputs.start }}" \
            --end-date "${{ steps.dates.outputs.end }}"
      - name: 整理月份 artifact 目錄
        run: |
          mkdir -p artifact/raw/taichung
          cp -a "monthly-output/raw/taichung/${{ inputs.year }}" artifact/raw/taichung/
      - name: 上傳月份原始資料
        uses: actions/upload-artifact@v4
        with:
          name: taichung-${{ inputs.year }}-month-${{ matrix.month }}
          path: artifact/
          retention-days: 7
          if-no-files-found: error

  finalize-full-year:
    if: inputs.run_mode == 'full_year'
    needs: collect-months
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 下載全部月份
        uses: actions/download-artifact@v4
        with:
          pattern: taichung-${{ inputs.year }}-month-*
          path: monthly-artifacts
      - name: 合併月份並建立臺中跨年度 CSV
        run: |
          python scripts/merge_monthly_raw.py \
            --input-root monthly-artifacts --output-root data \
            --region taichung --year "${{ inputs.year }}"
          python scripts/build_exports.py --region taichung --years "${{ inputs.year }}"
      - name: 檢查年度資料完整性
        run: python scripts/validate_processed.py --region taichung --year "${{ inputs.year }}" --unit-prefix 3.87
      - name: 上傳全年成果
        uses: actions/upload-artifact@v4
        with:
          name: taichung-procurement-${{ inputs.year }}-full-year
          path: |
            data/raw/taichung/${{ inputs.year }}/**
            data/processed/taichung/*.csv
          retention-days: 30
      - name: 提交臺中可重現資料成果
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f -- data/raw/taichung/*/manifest.json data/raw/taichung/*/errors.json data/raw/taichung/*/decision_index.json
          git add -- data/processed/taichung/*.csv
          if git diff --cached --quiet; then
            echo "沒有臺中資料異動"
          else
            git commit -m "data: update Taichung procurement ${{ inputs.year }}"
            git push
          fi
